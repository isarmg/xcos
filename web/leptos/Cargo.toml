[package]
name = "xcos-web"
version = "1.0.0"
edition = "2024"

[workspace]
exclude = ["vendor/xcss-web"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.19", features = ["csr"] }
xcss-web = { path = "vendor/xcss-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
futures = "0.3"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Performance", "Location", "EventSource", "Event", "MessageEvent", "HtmlVideoElement", "HtmlMediaElement", "HtmlElement", "HtmlButtonElement", "HtmlDialogElement", "HtmlInputElement", "PointerEvent", "KeyboardEvent", "AbortController", "AbortSignal", "Request", "RequestInit", "RequestRedirect", "RequestCredentials", "Headers", "Response", "RtcPeerConnection", "RtcConfiguration", "RtcIceServer", "RtcRtpTransceiverInit", "RtcRtpTransceiver", "RtcRtpTransceiverDirection", "RtcSessionDescriptionInit", "RtcSdpType", "RtcSessionDescription", "RtcTrackEvent", "RtcPeerConnectionState", "RtcIceGatheringState", "MediaStream", "MediaStreamTrack", "Crypto", "Url", "UrlSearchParams"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
