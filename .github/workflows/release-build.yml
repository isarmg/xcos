name: Release build

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the pinned xcss product manifest
        shell: bash
        run: |
          set -euo pipefail
          readarray -t foundation_identity < <(python3 - <<'PY'
          import tomllib
          with open("xcss-product.toml", "rb") as stream:
              foundation = tomllib.load(stream)["foundation"]
          print(foundation["version"])
          print(foundation["git_rev"])
          PY
          )
          foundation_root="$RUNNER_TEMP/xcss"
          [[ "${foundation_identity[1]}" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$foundation_root"
          git -C "$foundation_root" remote add origin https://github.com/isarmg/xcss.git
          git -C "$foundation_root" fetch --quiet --depth=1 origin "${foundation_identity[1]}"
          git -C "$foundation_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$foundation_root" rev-parse HEAD)" = "${foundation_identity[1]}"
          python3 - "$foundation_root/Cargo.toml" "${foundation_identity[0]}" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as stream:
              package = tomllib.load(stream)["package"]
          assert package["name"] == "xcss"
          assert package["version"] == sys.argv[2], "pinned xcss version differs from manifest"
          PY
          python3 "$foundation_root/scripts/xcss-conformance.py" \
            verify-manifest --product-root "$GITHUB_WORKSPACE"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install locked inventory tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install locked Web dependencies
        run: npm ci --prefix web
      - name: Build and verify the Server archive and SHA-256 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-output"
          bash scripts/package-release.sh --output-dir "$RUNNER_TEMP/release-output"
      - name: Retain verified release inputs for automatic publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server
          path: ${{ runner.temp }}/release-output/*
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server
          path: release-output
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to reuse or overwrite existing release $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-output/* \
            --verify-tag \
            --notes-file "$notes" \
            --title "xcos $GITHUB_REF_NAME"
