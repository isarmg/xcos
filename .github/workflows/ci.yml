name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Superseded branch/PR CI can stop; release and manual runs stay independent.
concurrency:
  group: xcos-ci-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) }}

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  frontend:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install pinned Rust browser toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the pinned Web dependency graph
        run: |
          node --version
          npm --version
          npm ci --prefix web
          npm run check:xcss --prefix web
          cargo +1.99.0 fmt --manifest-path tools/web-build/Cargo.toml -- --check
          cargo +1.99.0 test --locked --manifest-path tools/web-build/Cargo.toml
          cargo +1.99.0 clippy --manifest-path tools/web-build/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.99.0 fmt --manifest-path web/xcss-web/Cargo.toml -- --check
          CARGO_TARGET_DIR=target/xcss-web cargo +1.99.0 clippy --manifest-path web/xcss-web/Cargo.toml --locked --target wasm32-unknown-unknown --all-targets --no-deps -- -D warnings
          npm run test:unit --prefix web
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
      - name: Install acceptance browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify business UI and shared platform integration
        working-directory: web
        run: npm run test:browser
      - name: Verify startup failure visibility and explicit reload
        working-directory: web
        run: npm run test:startup

  rust:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the pinned xcss product manifest
        shell: bash
        run: |
          set -euo pipefail
          readarray -t foundation_identity < <(python3 - <<'PY'
          import tomllib
          with open("xcss-product.toml", "rb") as stream:
              foundation = tomllib.load(stream)["foundation"]
          print(foundation["version"])
          print(foundation["git_rev"])
          PY
          )
          foundation_root="$RUNNER_TEMP/xcss"
          [[ "${foundation_identity[1]}" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$foundation_root"
          git -C "$foundation_root" remote add origin https://github.com/isarmg/xcss.git
          git -C "$foundation_root" fetch --quiet --depth=1 origin "${foundation_identity[1]}"
          git -C "$foundation_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$foundation_root" rev-parse HEAD)" = "${foundation_identity[1]}"
          python3 - "$foundation_root/Cargo.toml" "${foundation_identity[0]}" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as stream:
              package = tomllib.load(stream)["package"]
          assert package["name"] == "xcss"
          assert package["version"] == sys.argv[2], "pinned xcss version differs from manifest"
          PY
          python3 "$foundation_root/scripts/xcss-conformance.py" \
            verify-manifest --product-root "$GITHUB_WORKSPACE"
      - name: Install Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Build current Web compilation inputs
        run: |
          npm ci --prefix web
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- server --product-root . --config xcss-web-build.json --mode development --web-only
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Exercise the real pinned companion configuration
        shell: bash
        run: |
          set -euo pipefail
          companion_dir="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$companion_dir/mediamtx.tar.gz" \
            https://github.com/bluenviron/mediamtx/releases/download/v1.20.0/mediamtx_v1.20.0_linux_amd64.tar.gz
          tar -xzf "$companion_dir/mediamtx.tar.gz" -C "$companion_dir" mediamtx
          python3 scripts/companion-smoke-test.py "$companion_dir/mediamtx"
          XCOS_TEST_MEDIAMTX="$companion_dir/mediamtx" \
            cargo test --locked --all-features --test runtime_smoke -- --ignored --nocapture

  native-shell:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(git ls-files -z -- 'scripts/*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo 'No tracked native shell scripts found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"
      - name: Install pinned Node.js for deployment test inputs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install pinned Rust browser toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build embedded Web inputs for deployment tests
        run: |
          npm ci --prefix web
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- server --product-root . --config xcss-web-build.json --mode development --web-only
      - name: Verify systemd controls and release packaging
        run: ./scripts/check-deployment.sh

  installed_candidate:
    name: Installed release lifecycle
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SERVER_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out exact candidate source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce candidate workflow and packaging boundaries
        run: |
          python3 -I -B scripts/test-installed-candidate-workflow.py
          python3 -I -B scripts/test-installed-lifecycle-adapter.py
          python3 -I -B scripts/test-stage-product.py
          bash -n scripts/package-installed-candidate.sh scripts/stage-product.sh
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Identify exact release compilation environment
        id: release_environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.7.0
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          fingerprint="$({
            printf '%s\n' "$ImageOS" "$ImageVersion"
            rustc --version --verbose
            cargo --version --verbose
            env | LC_ALL=C sort | grep -E '^(CARGO_|RUST|CC=|CXX=|CFLAGS=|CXXFLAGS=|LDFLAGS=|AR=|HOST_|TARGET_|SOURCE_DATE_EPOCH=)' || true
          } | sha256sum | cut -d ' ' -f 1)"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore exact release Cargo dependencies
        id: release_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          # No fallback keys. Only a successful main push saves this cache.
          key: xcos-installed-release-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ env.SERVER_TARGET }}-${{ steps.release_environment.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'tools/web-build/Cargo.lock', 'tools/web-build/src/**', 'web/rust-web.toml', 'web/vendor/**', 'web/xcss-web/vendor/**', 'web/xcss-web/Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/**', 'rust-toolchain.toml', 'config/xssi.lock', 'config/mediamtx.lock', 'web/package-lock.json', 'xcss-web-build.json', '.github/workflows/ci.yml') }}
      - name: Discard cached first-party candidate products
        run: |
          cargo clean --package xcos --release --target "$SERVER_TARGET"
      - name: Restore exact source-built inventory tools
        id: inventory_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/install-inventory-tools
          key: xcos-inventory-tools-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-audit-0.22.2-cyclonedx-0.5.9-${{ steps.release_environment.outputs.fingerprint }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Prepare real pinned installer and inventory tools
        id: install_tools
        shell: bash
        env:
          INVENTORY_CACHE_HIT: ${{ steps.inventory_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/install-inventory-tools"
          if [[ "$INVENTORY_CACHE_HIT" != true ]]; then
            [[ ! -e "$tools" && ! -L "$tools" ]]
            cargo install --locked --registry crates-io --root "$tools" cargo-audit --version 0.22.2
            cargo install --locked --registry crates-io --root "$tools" cargo-cyclonedx --version 0.5.9
            (cd "$tools" && sha256sum bin/cargo-audit bin/cargo-cyclonedx > SHA256SUMS)
          fi
          (cd "$tools" && sha256sum --check SHA256SUMS)
          export PATH="$tools/bin:$PATH"
          cargo audit --version | grep -Fx 'cargo-audit-audit 0.22.2'
          cargo cyclonedx --version | grep -Fx 'cargo-cyclonedx-cyclonedx 0.5.9'
          printf '%s\n' "$tools/bin" >> "$GITHUB_PATH"
          revision="$(python3 -I -B -c 'import pathlib,re; raw=pathlib.Path("config/xssi.lock").read_text(encoding="ascii"); match=re.fullmatch(r"git_rev=([0-9a-f]{40})\n",raw); assert match and match[1]!="0"*40; print(match[1])')"
          installer="$RUNNER_TEMP/install-xssi"
          git init --quiet "$installer"
          git -C "$installer" remote add origin https://github.com/isarmg/xssi.git
          git -C "$installer" fetch --quiet --depth=1 origin "$revision"
          git -C "$installer" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$installer" rev-parse HEAD)" == "$revision" ]]
          [[ -z "$(git -C "$installer" status --porcelain=v1 --untracked-files=all)" ]]
          test -f "$installer/scripts/package-installed-candidate.py"
          test -f "$installer/tests/installed_lifecycle.py"
          mkdir -m 0700 "$RUNNER_TEMP/install-metadata"
      - name: Save verified inventory tools
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.inventory_cache.outputs.cache-hit != 'true' && steps.install_tools.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/install-inventory-tools
          key: ${{ steps.inventory_cache.outputs.cache-primary-key }}
      - name: Identify exact media-tool build environment
        id: media_environment
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(bash scripts/prepare-installed-media-tools.sh --fingerprint)"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore exact test-only media tools
        id: media_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/install-media-tools
          # No fallback keys; bind source, flags, image, compiler and OpenSSL.
          key: xcos-installed-media-v1-${{ runner.os }}-${{ runner.arch }}-ffmpeg-9.0.2-8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e-${{ steps.media_environment.outputs.fingerprint }}-${{ hashFiles('scripts/prepare-installed-media-tools.sh') }}
      - name: Build or verify pinned media tools and fixture
        id: media_tools
        shell: bash
        env:
          MEDIA_CACHE_HIT: ${{ steps.media_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/install-media-tools"
          if [[ "$MEDIA_CACHE_HIT" != true ]]; then
            # Reject a prefix restore too; only an exact cache hit is reusable.
            [[ ! -e "$tools" && ! -L "$tools" ]]
          fi
          bash scripts/prepare-installed-media-tools.sh "$tools"
      - name: Save verified test-only media tools
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.media_cache.outputs.cache-hit != 'true' && steps.media_tools.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/install-media-tools
          key: ${{ steps.media_cache.outputs.cache-primary-key }}
      - name: Build the source-bound release Server once
        id: release_binary
        env:
          XSSI_BUILD_TOOLS_DIR: ${{ runner.temp }}/install-xssi
          XSSI_BUILD_METADATA_DIR: ${{ runner.temp }}/install-metadata
          XSSI_FRONTEND_METADATA_FILE: ${{ runner.temp }}/install-metadata/frontend.json
          XCOS_SOURCE_REVISION: ${{ github.sha }}
        run: |
          cargo +1.99.0 run --quiet --locked --manifest-path tools/web-build/Cargo.toml -- server --product-root . --config xcss-web-build.json --mode release --source-revision "$GITHUB_SHA"
          "$CARGO_TARGET_DIR/$SERVER_TARGET/release/xcos" --version | grep -F 'xcos '
      - name: Save successfully compiled release dependencies
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_cache.outputs.cache-hit != 'true' && steps.release_binary.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ steps.release_cache.outputs.cache-primary-key }}
      - name: Package the exact release binary with real helper and audits
        id: package_candidate
        run: |
          bash scripts/package-installed-candidate.sh \
            "$CARGO_TARGET_DIR/$SERVER_TARGET/release/xcos" \
            "$RUNNER_TEMP/install-metadata" "$RUNNER_TEMP/install-xssi" "$RUNNER_TEMP/install-candidate"
      - name: Exercise production TLS authentication and installed systemd lifecycle
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install-xssi"
          candidates=("$RUNNER_TEMP/install-candidate"/xcos-*-linux-x86_64.tar.gz)
          [[ ${#candidates[@]} == 1 && -f "${candidates[0]}" ]]
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            LIFECYCLE_DIAGNOSTICS="$RUNNER_TEMP/install-diagnostics" \
            XCOS_MEDIA_TOOLS="$RUNNER_TEMP/install-media-tools" \
            python3 -I -B "$installer/tests/installed_lifecycle.py" \
            --adapter "$GITHUB_WORKSPACE/scripts/installed-lifecycle-adapter.py" "${candidates[0]}" "$GITHUB_SHA"
      - name: Retain redacted installation lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/install-diagnostics
          if-no-files-found: ignore
          retention-days: 3
